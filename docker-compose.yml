version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AL_PORT: "8080"
      AL_DATABASE_URL: "postgres://airline:airline_dev@postgres:5432/airline?sslmode=disable"
      AL_REDIS_ADDR: "redis:6379"
      AL_JWT_SECRET: "dev-jwt-secret-change-in-prod"
      AL_JWT_EXPIRY: "60"
      AL_REFRESH_EXPIRY: "7"
      AL_STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_dummy}"
      AL_STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_dummy}"
      AL_ALLOWED_ORIGINS: "http://localhost:3000"
      AL_RATE_LIMIT_PER_SEC: "10"
      AL_LOG_LEVEL: "debug"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4
    command:
      - "-path=/migrations"
      - "-database=postgres://airline:airline_dev@postgres:5432/airline?sslmode=disable"
      - "up"
    volumes:
      - ./backend/db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
